version: '3.8'

# ============================================================================
# Docker Compose — Ambiente de DESENVOLVIMENTO
# Sistema de Registro de Atendimento em Local de Crime (PCPE)
# ============================================================================
# Uso:
#   1. Copie .env.example para .env e ajuste as variáveis
#   2. Execute: docker compose -f docker-compose.dev.yml up -d
#   3. Para parar: docker compose -f docker-compose.dev.yml down
#   4. Para limpar volumes: docker compose -f docker-compose.dev.yml down -v
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4 — Banco principal
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pcpe_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcpe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcpe_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-pcpe_db}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pcpe_admin} -d ${POSTGRES_DB:-pcpe_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pcpe_network_dev

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — Interface gráfica de administração
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pcpe_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pcpe.gov.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_secret_2026}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pcpe_network_dev

volumes:
  pgdata_dev:
    name: pcpe_pgdata_dev
  pgadmin_data_dev:
    name: pcpe_pgadmin_data_dev

networks:
  pcpe_network_dev:
    name: pcpe_network_dev
    driver: bridge