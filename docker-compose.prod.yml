version: '3.8'

# ============================================================================
# Docker Compose — Ambiente de PRODUÇÃO
# Sistema de Registro de Atendimento em Local de Crime (PCPE)
# ============================================================================
# Uso:
#   1. Configure as variáveis de ambiente no .env.production
#   2. Execute: docker compose -f docker-compose.prod.yml up -d
#   3. Para parar: docker compose -f docker-compose.prod.yml down
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4 — Banco principal
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pcpe_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./docker/postgres/init-prod.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pcpe_network_prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — Interface gráfica de administração
  # (Remova em produção se não for necessário)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pcpe_pgadmin_prod
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data_prod:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pcpe_network_prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  pgdata_prod:
    name: pcpe_pgdata_prod
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/pcpe/postgres
  pgadmin_data_prod:
    name: pcpe_pgadmin_data_prod

networks:
  pcpe_network_prod:
    name: pcpe_network_prod
    driver: bridge