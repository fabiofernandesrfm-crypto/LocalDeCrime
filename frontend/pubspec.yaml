name: pcpe_frontend
description: "Sistema de Registro de Atendimentos em Locais de Crime - PCPE"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.0

  # Routing
  go_router: ^17.3.0

  # Responsive
  responsive_framework: ^1.4.0

  # Modern Typography
  google_fonts: ^6.1.0

  # Utils
  logger: ^2.0.0
  intl: ^0.19.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets: []